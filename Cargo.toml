[package]
name = "temprix"
version = "1.0.0"
edition = "2021"
description = "Zero-copy file history using APFS clonefile"

[dependencies]
notify = { version = "7", features = ["macos_fsevent"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
